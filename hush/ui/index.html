<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hush.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="12" fill="#3E6A9E"/><path id="bw1" d="M11 18 Q 16.5 13 22 18 T 33 18" fill="none" stroke="#8FA6C4" stroke-width="2.4" stroke-linecap="round"/><path id="bw2" d="M11 26 Q 16.5 21 22 26 T 33 26" fill="none" stroke="#F3EFE7" stroke-width="2.8" stroke-linecap="round"/></svg>
      <span class="brand-word">hush.</span>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-pill" id="navPill"></div>
      <button class="nav-item on" data-view="focus"><svg class="i"><use href="#i-target"/></svg>Focus</button>
      <button class="nav-item" data-view="stats"><svg class="i"><use href="#i-chart"/></svg>Stats</button>
      <button class="nav-item" data-view="block"><svg class="i"><use href="#i-shield"/></svg>Blocklist</button>
      <button class="nav-item" data-view="settings"><svg class="i"><use href="#i-settings"/></svg>Settings</button>
    </nav>
    <div class="side-foot">
      <div class="using" id="using"></div>
      <div class="streak">
        <div class="k"><svg class="i"><use href="#i-flame"/></svg>Focus streak</div>
        <div class="v" id="streakV">0 days</div>
        <div class="dots" id="streakDots"></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <!-- FOCUS -->
    <section class="view on" id="v-focus">
      <div class="head">
        <div><h1 class="h1" id="greet">Good evening</h1><div class="sub" id="dateLine"></div></div>
        <div class="seg" id="modeSeg"><div class="seg-pill"></div>
          <button data-mode="soft" class="on">Soft</button>
          <button data-mode="hard"><svg class="i"><use href="#i-lock"/></svg>Hard</button>
        </div>
      </div>
      <div class="focus-grid">
        <div class="card timer-card">
          <button class="btn icon ghost expand-btn" id="zenBtn" title="Full screen (F)"><svg class="i"><use href="#i-maximize"/></svg></button>
          <input class="label-input" id="labelInput" type="text" maxlength="80" placeholder="What are you focusing on?">
          <div class="tide-wrap" id="tideWrap"><canvas id="tide"></canvas></div>
          <div class="sess-dots" id="sessDots"></div>
          <div class="setup" id="setup">
            <div class="chips" id="presets"></div>
            <div class="setup-row">Sessions <div class="stepper"><button id="sMinus">−</button><span id="sCount">4</span><button id="sPlus">+</button></div></div>
          </div>
          <div class="controls">
            <button class="btn icon gone" id="bStop" title="Stop"><svg class="i"><use href="#i-stop"/></svg></button>
            <button class="btn primary" id="bMain"><svg class="i"><use href="#i-play"/></svg><span>Start focus</span></button>
            <button class="btn icon gone" id="bSkip" title="Skip"><svg class="i"><use href="#i-skip"/></svg></button>
          </div>
          <div class="lock-note" id="lockNote"></div>
        </div>
        <div class="side-col">
          <div class="card">
            <p class="label"><span>Daily goal</span><span id="goalTxt">0m / 4h</span></p>
            <div class="goal-bar"><div id="goalBar" style="transform:scaleX(0)"></div></div>
          </div>
          <div class="card">
            <p class="label"><span>Up next</span><button class="btn ghost sm" id="clearDone" style="height:24px;padding:0 8px">Clear done</button></p>
            <div class="tasks" id="tasks"></div>
            <input class="add-task" id="taskInput" type="text" placeholder="Add a task, press Enter">
          </div>
          <div class="card">
            <p class="label"><span>Ambient</span></p>
            <div class="chips" id="ambient" style="margin-top:10px">
              <button class="chip" data-snd="rain"><svg class="i"><use href="#i-rain"/></svg>Rain</button>
              <button class="chip" data-snd="waves"><svg class="i"><use href="#i-waves"/></svg>Waves</button>
              <button class="chip" data-snd="brown"><svg class="i"><use href="#i-noise"/></svg>Brown noise</button>
            </div>
            <div class="vol"><svg class="i"><use href="#i-volume"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.5"></div>
          </div>
          <div class="card blocked-card" id="blockedCard"><svg class="i"><use href="#i-shield"/></svg><span id="blockedTxt">Blocking turns on when focus starts</span></div>
        </div>
      </div>
    </section>

    <!-- STATS -->
    <section class="view" id="v-stats">
      <div class="head stats-head">
        <div><h1 class="h1" id="statsTitle">Today</h1><div class="sub" id="statsSub">Where your time went</div></div>
        <div class="stats-ctl">
          <div class="seg" id="srcSeg"><div class="seg-pill"></div>
            <button data-s="laptop" class="on"><svg class="i"><use href="#i-desktop"/></svg>Laptop</button><button data-s="phone"><svg class="i"><use href="#i-phone"/></svg>Phone</button><button data-s="all"><svg class="i"><use href="#i-devices"/></svg>Combined</button>
          </div>
          <div class="seg" id="rangeSeg"><div class="seg-pill"></div>
            <button data-r="day" class="on">Day</button><button data-r="week">Week</button><button data-r="month">Month</button>
          </div>
          <button class="btn sm" id="shareBtn" title="Save or copy a picture of these stats"><svg class="i"><use href="#i-share"/></svg>Share</button>
        </div>
      </div>
      <div class="stats-top" id="cards"></div>
      <div class="stats-grid">
        <div class="card chart-card"><p class="label"><span id="chartTitle">By hour</span><span class="legend" id="legend"></span></p>
          <div class="chart"><div class="grid" id="grid"></div><div class="bars" id="bars"></div></div><div class="axis" id="axis"></div></div>
        <div class="card"><p class="label"><span>Categories</span><span id="catTotal"></span></p>
          <div class="cat-stack" id="catStack"></div>
          <div class="cat-rows" id="catList"></div>
        </div>
      </div>
      <div class="card"><p class="label"><span id="appsTitle">Top apps</span><span>click a category to change it</span></p><div id="apps" style="margin-top:6px"></div></div>
      <div class="sync-note" id="syncNote"></div>
    </section>

    <!-- BLOCKLIST -->
    <section class="view" id="v-block">
      <div class="head"><div><h1 class="h1">Blocklist</h1><div class="sub">What stays closed while you focus</div></div></div>
      <div class="tabs" id="blockTabs"><button data-t="apps" class="on">Apps</button><button data-t="sites">Websites</button><div class="tab-line"></div></div>
      <div class="block-grid">
        <div class="card" id="blockMain"></div>
        <div style="display:flex;flex-direction:column;gap:12px" id="blockSide"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="v-settings">
      <div class="head"><div><h1 class="h1">Settings</h1><div class="sub">Make hush. yours</div></div></div>
      <div class="set-grid" id="settingsGrid"></div>
    </section>
  </main>
</div>
<div class="zen" id="zen" aria-hidden="true">
  <div class="zen-top">
    <span class="zen-brand">hush.</span>
    <button class="btn icon ghost" id="zenExit" title="Exit full screen (Esc)"><svg class="i"><use href="#i-minimize"/></svg></button>
  </div>
  <div class="zen-tide" id="zenTide"></div>
  <div class="zen-dots" id="zenDots"></div>
  <div class="zen-ctrl"><button class="btn primary" id="zenMain"></button></div>
</div>
<div class="toasts" id="toasts"></div>
